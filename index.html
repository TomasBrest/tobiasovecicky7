<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>JARVIS</title>
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#0a0a0b;--card:#141416;--card2:#1d1d21;--line:rgba(255,255,255,.07);--tx:#f4f4f5;--mut:#8e8e96;--acc:#60a5fa;--acc2:#93c5fd;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--blue:#60a5fa;--r:20px;--safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",Segoe UI,Roboto,sans-serif;letter-spacing:-.01em;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--acc2);text-decoration:none}
.hide{display:none!important}
.muted{color:var(--mut)}
.small{font-size:13px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#login{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:32px;gap:12px;max-width:420px;margin:auto}
.logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:32px;letter-spacing:-.04em}
.logo img{width:52px;height:52px;border-radius:14px}
.in{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:none;transition:border-color .15s}
.in:focus{border-color:rgba(96,165,250,.6)}
textarea.in{min-height:90px;resize:vertical}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:600;background:var(--tx);color:#000;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn.acc{background:linear-gradient(135deg,#5eead4,#60a5fa 55%,#818cf8);color:#04121f}
.btn.ghost{background:var(--card2);color:var(--tx)}
.btn.ok{background:var(--ok);color:#022c1e}
.btn.bad{background:transparent;color:var(--bad);border:1px solid rgba(248,113,113,.25)}
.btn.sm{padding:9px 13px;font-size:13.5px;border-radius:12px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{position:absolute;top:0;left:0;right:0;padding:calc(var(--safe-t) + 12px) 18px 10px;display:flex;align-items:center;gap:10px;z-index:6;pointer-events:none}
header>*{pointer-events:auto}
header h1{font-size:28px;margin:0;font-weight:700;flex:1;letter-spacing:-.04em}
header{background:linear-gradient(var(--bg) 62%,rgba(10,10,11,0))}
body.onmap header{background:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,0))}
body.onmap header h1{color:#fff;text-shadow:0 1px 14px rgba(0,0,0,.35)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mut);display:inline-block}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.2)}
.pill{background:rgba(20,20,22,.72);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;display:inline-flex;gap:7px;align-items:center;white-space:nowrap;color:var(--tx)}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;padding:calc(var(--safe-t) + 64px) 16px calc(96px + var(--safe-b));-webkit-overflow-scrolling:touch}
#v-map{padding:0;overflow:hidden}
nav{position:absolute;left:12px;right:12px;bottom:calc(10px + var(--safe-b));display:flex;background:rgba(24,24,27,.78);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--line);border-radius:24px;padding:6px;z-index:10;box-shadow:0 10px 40px rgba(0,0,0,.35)}
nav button{flex:1;background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;padding:7px 0 5px;position:relative;border-radius:18px;transition:color .15s,background .15s}
nav button svg.i{width:22px;height:22px}
nav button.on{color:var(--tx);background:rgba(255,255,255,.07)}
.badge{position:absolute;top:2px;right:calc(50% - 20px);background:var(--acc);color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;padding:0 4px;display:flex;align-items:center;justify-content:center;font-weight:700}
#map{position:absolute;inset:0;background:#05060a}
.mapbar{position:absolute;top:calc(var(--safe-t) + 60px);left:0;right:0;padding:0 14px;display:flex;gap:6px;z-index:3;overflow-x:auto;scrollbar-width:none}
.mapbar::-webkit-scrollbar{display:none}
.mapbar .pill{cursor:pointer;font-weight:500}
.mapbar .pill.on{background:rgba(255,255,255,.92);color:#000;border-color:transparent}
.mapbar .sep{width:1px;background:var(--line);margin:4px 2px;flex:none}
.mk{width:38px;height:38px;border-radius:50%;border:2.5px solid #fff;background:#222 center/cover;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff}
.mk.agent{width:30px;height:30px;background:#111;border:2px solid var(--blue)}
.mk.home{width:16px;height:16px;background:var(--ok);border:3px solid #fff}
.mk.fac{background:#2a2a30}
.veh{width:34px;height:34px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px rgba(96,165,250,.22),0 6px 18px rgba(0,0,0,.4);cursor:pointer;color:#fff}
.veh svg{width:19px;height:19px;fill:#fff;stroke:none}
.veh.wait{background:#2a2a30;box-shadow:0 0 0 5px rgba(255,255,255,.08)}
.vlab{position:absolute;top:38px;left:50%;transform:translateX(-50%);background:rgba(10,10,11,.8);color:#fff;font-size:10.5px;padding:2px 7px;border-radius:8px;white-space:nowrap;pointer-events:none;font-weight:500}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:10px 0}
.sec{font-size:13px;color:var(--mut);margin:26px 4px 8px;font-weight:600;display:flex;align-items:center;gap:8px}
.sec span{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--card);border-radius:999px;padding:8px 13px;font-size:13px;white-space:nowrap;cursor:pointer;color:var(--mut);font-weight:500}
.chip b{color:var(--tx);font-weight:600;margin-left:3px}
.chip.on{background:var(--tx);color:#000}
.chip.on b{color:#000}
.ord{display:flex;gap:14px;align-items:center;cursor:pointer}
.ord .ph{width:56px;height:56px;border-radius:14px;background:var(--card2) center/cover;flex:none;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.ord .bd{flex:1;min-width:0}
.ord .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ord .s{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:flex;gap:3px;margin-top:9px}
.prog i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.08)}
.prog i.on{background:var(--acc)}
.prog i.done{background:var(--ok)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 7px;border-radius:7px;background:var(--card2);color:var(--mut);margin-right:4px;font-weight:500}
.tag.acc{background:rgba(96,165,250,.14);color:var(--acc2)}
.tag.ok{background:rgba(52,211,153,.12);color:var(--ok)}
.tag.warn{background:rgba(251,191,36,.12);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:18px;padding:14px}
.stat b{display:block;font-size:22px;font-weight:700;letter-spacing:-.03em}
.stat small{color:var(--mut);font-size:12px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 12px;margin-bottom:12px}
.search input{flex:1;background:none;border:0;outline:none;padding:12px 0}
.draft .them{background:var(--card2);border-radius:16px 16px 16px 6px;padding:10px 12px;margin:10px 0;font-size:14px}
.draft textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:11px;min-height:74px;resize:vertical;outline:none}
.why{font-size:13px;color:var(--acc2);margin-top:4px}
.bub{max-width:82%;padding:9px 12px;border-radius:18px;margin:5px 0;font-size:14px;white-space:pre-wrap;word-break:break-word}
.bub.me{background:var(--acc);color:#fff;margin-left:auto;border-bottom-right-radius:6px}
.bub.them{background:var(--card2);border-bottom-left-radius:6px}
.bub.s{background:none;color:var(--mut);font-size:11.5px;text-align:center;margin:6px auto}
.live{width:100%;border-radius:18px;background:#000;display:block;min-height:120px}
.log{font-size:13px;max-height:260px;overflow:auto;padding:6px 16px}
.log div{padding:8px 0;border-bottom:1px solid var(--line)}
.log div:last-child{border:0}
#sheet{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end}
#sheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#sheet .pan{position:relative;background:#111113;border-radius:28px 28px 0 0;max-height:92%;overflow-y:auto;padding:8px 18px calc(28px + var(--safe-b));animation:up .25s cubic-bezier(.2,.9,.3,1)}
#sheet .grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);margin:4px auto 12px}
@keyframes up{from{transform:translateY(60px);opacity:.3}to{transform:none;opacity:1}}
.hero{width:100%;aspect-ratio:16/10;border-radius:20px;background:var(--card2) center/cover;margin-bottom:12px}
h2{font-size:22px;letter-spacing:-.03em;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;font-size:14px;background:var(--card);border-radius:var(--r);padding:16px;margin:10px 0}
.kv dt{color:var(--mut)}
.kv dd{margin:0;word-break:break-word}
.tl{margin:6px 0 0 4px;padding-left:16px;border-left:1.5px solid rgba(255,255,255,.1)}
.tl div{position:relative;padding:0 0 14px}
.tl div:before{content:"";position:absolute;left:-21px;top:5px;width:9px;height:9px;border-radius:50%;background:#3a3a40}
.tl div:first-child:before{background:var(--acc);box-shadow:0 0 0 4px rgba(96,165,250,.2)}
.tl b{font-size:14px;font-weight:500}
.tl small{display:block;color:var(--mut);font-size:12px}
label.f{display:block;font-size:12.5px;color:var(--mut);margin:12px 2px 5px;font-weight:500}
.copy{cursor:pointer;border-bottom:1px dashed rgba(255,255,255,.25)}
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 14px);transform:translateX(-50%);background:rgba(244,244,245,.96);color:#000;padding:11px 16px;border-radius:16px;font-weight:600;font-size:14px;z-index:99;box-shadow:0 10px 40px rgba(0,0,0,.35);max-width:90%;text-align:center;animation:up .25s}
.qtab{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
.qtab td,.qtab th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;font-weight:500}
.qtab th{color:var(--mut);font-size:12px}
.qtab tr.best td{color:var(--ok);font-weight:600}
.empty{text-align:center;color:var(--mut);padding:40px 16px}
.empty svg.i{width:34px;height:34px;margin-bottom:10px;opacity:.6}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.grid3 img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--card2);display:block}
.sw{position:relative;display:inline-block;width:46px;height:28px;flex:none!important}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:#3a3a40;border-radius:20px;transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span:before{transform:translateX(18px)}
.maplibregl-ctrl-attrib{font-size:10px;background:rgba(255,255,255,.6)!important}
.maplibregl-ctrl-bottom-right{bottom:calc(84px + var(--safe-b))}

.hello{font-size:15px;color:var(--mut);margin:2px 4px 14px}
.big{font-size:34px;font-weight:700;letter-spacing:-.04em;margin:0}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.task:last-child{border:0}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid #3a3a42;flex:none;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--ok);border-color:var(--ok)}
.task .t{font-size:15px}
.task .s{font-size:12.5px;color:var(--mut);margin-top:2px}
.over{color:var(--bad)!important}
.day h4{margin:14px 4px 6px;font-size:13px;color:var(--mut);font-weight:600}
.cls{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.cls:last-child{border:0}
.cls .tm{width:52px;flex:none;font-weight:600;font-size:14px}
.cls .tm small{display:block;color:var(--mut);font-weight:400}
.wake{position:fixed;inset:0;z-index:80;background:radial-gradient(120% 80% at 50% 20%,#14263f,#05070b 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
.wake h1{font-size:40px;letter-spacing:-.04em;margin:10px 0 6px}
.cam{width:180px;height:180px;border-radius:50%;background:linear-gradient(135deg,#5eead4,#60a5fa 55%,#818cf8);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 14px rgba(96,165,250,.15),0 0 0 30px rgba(96,165,250,.07);margin:34px auto;cursor:pointer;border:0}
.cam svg{width:70px;height:70px;stroke:#04121f;fill:none;stroke-width:1.6}
.code{letter-spacing:.5em;font-size:26px;text-align:center;font-weight:600}
input.mask{-webkit-text-security:disc}
</style>
</head>
<body>
<div id="login" class="hide">
  <div class="logo"><img src="icon-192.png" alt="">JARVIS</div>
  <p class="muted">Your day, school, mail and work – handled.</p>
  <div id="lStep1">
    <input class="in mask" id="lUser" type="text" placeholder="Username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
    <input class="in" id="lPass" type="password" placeholder="Password" autocomplete="current-password" style="margin-top:10px">
    <button class="btn acc" id="lGo" style="width:100%;margin-top:12px">Sign in</button>
  </div>
  <div id="lStep2" class="hide">
    <p>Enter the 6-digit code from Google Authenticator</p>
    <input class="in code" id="lCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
    <button class="btn acc" id="lVerify" style="width:100%;margin-top:12px">Verify</button>
  </div>
  <p class="small muted" id="lMsg">You stay signed in on this device.</p>
</div>

<div id="app" class="hide">
  <header>
    <h1 id="title">Today</h1>
    <span class="pill" id="agentPill"><span class="dot" id="agentDot"></span><span id="agentTxt">Agent</span></span>
  </header>
  <main>
    <section class="view" id="v-today"></section>
    <section class="view hide" id="v-tasks"></section>
    <section class="view hide" id="v-mail"></section>
    <section class="view hide" id="v-school"></section>
    <section class="view hide" id="v-more"></section>
  </main>
  <nav>
    <button data-tab="today" class="on"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
    <button data-tab="tasks"><svg class="i" viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Tasks</button>
    <button data-tab="mail"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>Mail<span class="badge hide" id="badge">0</span></button>
    <button data-tab="school"><svg class="i" viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></svg>School</button>
    <button data-tab="more"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button>
  </nav>
</div>
<div id="sheet" class="hide"><div class="bg"></div><div class="pan"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div id="wake" class="wake hide"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="app.js"></script>
</body>
</html>
